# Render Blueprint — free, persistent Node process with WebSocket support.
#
# Veil Hunt cannot run on serverless hosting: the authoritative simulation is a
# 60 Hz loop in a long-lived process and every room lives in that process's
# memory. Render's free web service keeps one container alive, which is exactly
# what the game needs, and serves the built client from the same origin so the
# Socket.IO connection is same-origin with no CORS setup.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: veil-hunt
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    # The server exposes /health; Render uses it to decide the deploy is live.
    healthCheckPath: /health
    envVars:
      # Vite 7 wants 20.19+ or 22.12+; pin so builds do not drift.
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
