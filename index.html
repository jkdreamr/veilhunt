<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070b" />
    <meta
      name="description"
      content="Veil Hunt — a two-player asymmetric hunt through moonlit ruins. One player hunts, one lights three ritual seals and runs for the gate."
    />
    <title>Veil Hunt</title>

    <!--
      Inline SVG favicon: this build ships no external assets, so the icon is a
      data URI rather than a file request.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070b'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='none' stroke='%236feaff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23ffb45c'/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="ui"></div>

      <!-- Last-resort message if the app throws before the UI can mount. -->
      <p id="boot-error" role="alert" hidden></p>

      <noscript>
        <div class="noscript">
          <h1>Veil Hunt</h1>
          <p>
            This game runs entirely in the browser and needs JavaScript and WebGL
            enabled. Turn JavaScript on and reload the page to play.
          </p>
        </div>
      </noscript>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
